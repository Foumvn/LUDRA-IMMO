name: Keep Render Alive
on:
  schedule:
    - cron: '*/14 * * * *' # S'exécute toutes les 14 minutes
  workflow_dispatch: # Permet de le lancer manuellement

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -s https://ludra-immo.onrender.com/api/health

swagger: "2.0"
info:
  title: API Immobilier
  description: API REST pour la gestion immobilière
  version: 1.0.0

host: ludra-immo.onrender.com
basePath: /api
schemes:
  - https

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header

definitions:
  User:
    type: object
    properties:
      uid:
        type: string
      name:
        type: string
      email:
        type: string
        format: email
      phone:
        type: string
      city:
        type: string
      role:
        type: string
        enum: [user, owner, admin]
      createdAt:
        type: string
        format: date-time

  Property:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
      description:
        type: string
      type:
        type: string
        enum: [house, apartment, villa, studio, office, land]
      price:
        type: number
      rooms:
        type: integer
      bathrooms:
        type: integer
      surface:
        type: number
      city:
        type: string
      status:
        type: string
        enum: [available, sold, rented, unavailable]
      images:
        type: array
        items:
          type: string
      createdAt:
        type: string
        format: date-time

  LoginRequest:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
      password:
        type: string

  RegisterRequest:
    type: object
    required:
      - email
      - password
      - name
      - phone
      - city
    properties:
      email:
        type: string
        format: email
      password:
        type: string
      name:
        type: string
      phone:
        type: string
      city:
        type: string

security:
  - Bearer: []

